                  - group "Sección fila" [ref=e284]:
                    - group "Sección fila" [ref=e289]:
                      - generic [ref=e290]: El taladro percutor GSB 16 RE de Bosch es recomendado para los trabajos más exigentes. Es el primer taladro de la categoría con 850W de potencia y una rotación de 3.500 RPM, es la combinación perfecta entre robustez y rendimiento. Es versátil, tiene 2 modos de perforación; con percusión y sin percusión. La carcasa reforzada, el engranaje helicoidal, el porta-escobillas y el botón de reversa de alta calidad hacen que la herramienta sea mucho más duradera, además de proporcionar una menor vibración y menos ruido para mayor comodidad del usuario. La alineación de sus piezas internas contribuye a una mayor vida útil. Esta nueva versión del taladro percutor GSB 16 RE de Bosch tiene empuñadura de goma para un mejor agarre y comodidad del operador durante el uso; tiene interruptor de velocidad variable, empuñadura auxiliar y radial para un manejo seguro y además cuenta con un botón de bloqueo ideal para trabajos continuos. El taladro percutor Bosch GSB 16 RE incluye una llave de mandril, empuñadura auxiliar, tope de profundidad, manual de instrucciones y viene en maletín. Cuenta con 2 años de garantía Bosch.
